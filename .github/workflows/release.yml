# On every push to main: run the tests and the Qur'an verification. If the
# version in package.json has no GitHub release yet, publish one automatically
# (with the packaged plugin + checksum). Bump the version in package.json,
# .claude-plugin/plugin.json and .codex-plugin/plugin.json together; Claude Code
# and Codex only see an update when that version changes.
name: Test & release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run verify

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released; nothing to do."
            exit 0
          fi
          npm pack
          sha256sum "quran-turn-$V.tgz" > "quran-turn-$V.tgz.sha256"
          # Release notes = this version's section of CHANGELOG.md, plus how to update.
          awk -v v="$V" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          printf '\n---\n**Update:** Claude Code: `/plugin` → Marketplaces → quran-turn → Enable auto-update (once), or run `claude plugin marketplace update quran-turn && claude plugin update quran-turn@quran-turn`, then `/reload-plugins`. Codex: run `codex plugin marketplace upgrade quran-turn`, `codex plugin add quran-turn@quran-turn`, and `codex plugin list`; restart the desktop app if used. In interactive `codex`, run `/hooks` and review any new or changed Quran Turn UserPromptSubmit, PermissionRequest, PostToolUse, and Stop hooks individually before the next turn.\n' >> notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "Quran Turn v$V" --notes-file notes.md \
            "quran-turn-$V.tgz" "quran-turn-$V.tgz.sha256"
