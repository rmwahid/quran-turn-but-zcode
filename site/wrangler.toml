# Cloudflare Pages project for quran.allrize.tech.
# Deploy:  cd site && npx wrangler pages deploy
# Secrets (never in this file or the repo):
#   npx wrangler pages secret put MIDTRANS_SERVER_KEY
#   npx wrangler pages secret put MIDTRANS_CLIENT_KEY
name = "quran-turn"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[vars]
MIDTRANS_IS_PRODUCTION = "true"
SITE_URL = "https://quran.allrize.tech"
